# Workspace cargo-audit config
# Keep ignore list limited to upstream issues that cannot be fixed in-tree.

[advisories]
ignore = [
    # zstd 0.13 / zstd-safe 7.x via pingora-header-serde <- pingora-cache <- pingora-proxy.
    # x2rp never enables Pingora's cache, so the header serde (and its zstd calls) are
    # unreachable; pingora-core already uses the fixed zstd 0.14. Each advisory's
    # affected API is additionally unused here (noted below). Drop these once
    # pingora-header-serde bumps its zstd dependency.
    "RUSTSEC-2026-0391", # zstd: context-reuse leak via stream raw with_context (unused API: one-shot CCtx/DCtx only)
    "RUSTSEC-2026-0398", # zstd-safe: Seekable::decompress past end of input (unused API: no seekable format)
    "RUSTSEC-2026-0403", # zstd-safe: uninit memory on legacy-frame failure via decompress_stream (unused API: one-shot only)
]
# Deliberately not ignored: RUSTSEC-2024-0388 (derivative), RUSTSEC-2024-0449
# (unsafe-libyaml) and RUSTSEC-2025-0134 (rustls-pemfile) are unmaintained-status
# warnings via pingora. They never fail the audit and staying visible keeps them
# from being forgotten when upstream replaces them.
