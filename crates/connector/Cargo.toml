[package]
name = "x2rp-connector"
version.workspace = true
edition.workspace = true
description = "x2rp connector: publishes private services over an outbound QUIC or WebSocket tunnel"

[[bin]]
name = "x2rp-connector"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
quinn = "0.11.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
# No provider of its own: `main` installs ring, and reqwest's default would link
# aws-lc as a second crypto library.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
mimalloc = { version = "0.1", default-features = false }
hex = "0.4.3"
serde_json = "1"
x2rp-proto = { path = "../proto" }

[dev-dependencies]
rcgen = "0.14"
