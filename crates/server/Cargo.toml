[package]
name = "x2rp"
version.workspace = true
edition.workspace = true
description = "x2rp: TLS-terminating reverse proxy with an embedded admin UI"

[lib]
name = "x2rp"
path = "src/lib.rs"

[[bin]]
name = "x2rp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
pingora-core = { version = "0.9.1", default-features = false, features = ["rustls"] }
pingora-proxy = { version = "0.9.1", default-features = false, features = ["rustls"] }
pingora-http = "0.9.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
# ring, as rustls and quinn use: the default aws-lc would link a second crypto library.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
http-body-util = "0.1"
x509-parser = "0.16"
rand = "0.10"
argon2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "tracing-log", "env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
anyhow = "1"
parking_lot = "0.12"
http = "1"
bytes = "1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
socket2 = "0.6"
ipnet = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
mimalloc = { version = "0.1", default-features = false }
x2rp-proto = { path = "../proto" }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio-tungstenite = "0.30"
